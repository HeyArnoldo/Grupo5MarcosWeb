<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" f>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark" aria-label="Navegación principal">
        <div class="container">
            <a class="navbar-brand" href="#inicio">TechLab</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
                aria-controls="menuPrincipal" aria-expanded="false" aria-label="Mostrar u ocultar navegación">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuPrincipal">
                <!-- Lista de enlaces -->
            </div>
        </div>
    </nav>

    <article class="col-12 col-md-6 col-xl-4">
        <div class="card h-100 shadow-sm">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS0GvKlfzT8N6tUVlfI5ifPSoxTuIpWY4-JUY-5jgPy59Ddig_SnShoY8w&s=10"
                class="card-img-top" alt="Estudiante diseñando una interfaz web" width="640" height="360"
                loading="lazy">
            <div class="card-body d-flex flex-column">
                <h3 class="card-title h5">Frontend con Bootstrap</h3>
                <p class="card-text">Interfaces responsivas y accesibles.</p>
                <button class="btn btn-outline-primary mt-auto" type="button" data-bs-toggle="modal"
                    data-bs-target="#modalRegistro" Marcos de Desarrollo Web | Semana 4 | Página 7
                    data-curso="Frontend con Bootstrap">
                    Solicitar información
                </button>
            </div>
        </div>
    </article>

    <div class="table-responsive">
        <table class="table table-striped align-middle">
            <caption>Horarios disponibles para el ciclo actual</caption>
            <thead>
                <tr>
                    <th scope="col">Ruta</th>
                    <th scope="col">Día</th>
                    <th scope="col">Horario</th>
                    <th scope="col">Modalidad</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <th scope="row">Frontend</th>
                    <td>Martes</td>
                    <td>19:00 - 21:00</td>
                    <td>Híbrida</td>
                </tr>
            </tbody>
        </table>
    </div>

    <form id="formRegistro" novalidate>
        <div class="modal-body">
            <label class="form-label" for="correo">Correo electrónico</label>
            <input class="form-control" id="correo" name="correo" type="email" autocomplete="email" required>
            <div class="invalid-feedback">Ingresa un correo válido.</div>
            <div class="form-check mt-3">
                <input class="form-check-input" id="acepta" name="acepta" type="checkbox" required>
                <label class="form-check-label" for="acepta">
                    Acepto el uso demostrativo de estos datos.
                </label>
                <div class="invalid-feedback">Debes aceptar para continuar.</div>
            </div>
            <p id="estadoFormulario" class="alert alert-success d-none mt-3" role="status" aria-live="polite"></p>
            Marcos de Desarrollo Web | Semana 4 | Página 8
        </div>
        <div class="modal-footer">
            <button class="btn btn-primary" type="submit">Registrar</button>
        </div>
    </form>








    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="js/app.js"></script>
</body>

</html>
