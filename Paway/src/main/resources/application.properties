spring.application.name=Paway
server.port=${PORT:5000}
server.forward-headers-strategy=framework
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

paway.provider.name=${PAWAY_PROVIDER_NAME:Paway Envios S.A.C.}
paway.provider.ruc=${PAWAY_PROVIDER_RUC:20123456789}
paway.provider.address=${PAWAY_PROVIDER_ADDRESS:Av. Los Alamos 123, Lima, Peru}
paway.provider.email=${PAWAY_PROVIDER_EMAIL:atencion@paway.groowtech.com}

# PostgreSQL (local defaults match compose.yaml; override with env vars in Coolify).
spring.datasource.url=${PAWAY_DB_URL:jdbc:postgresql://localhost:5440/paway}
spring.datasource.username=${PAWAY_DB_USER:paway}
spring.datasource.password=${PAWAY_DB_PASSWORD:paway}
# Schema is owned by Flyway migrations; Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.locations=classpath:db/migration
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Accounts. The admin account is created on startup only when both variables are set;
# there is no default password. Without them the app logs a warning and has no admin.
paway.admin.email=${PAWAY_ADMIN_EMAIL:}
paway.admin.password=${PAWAY_ADMIN_PASSWORD:}

# Session cookie. The app has no CSRF tokens: SameSite=Lax is the CSRF mitigation, because
# the browser does not send the cookie on cross-site POST requests. Secure must be true behind
# HTTPS (set PAWAY_COOKIE_SECURE=true in production); false keeps local http working.
# Cookie-only session tracking: never put ;jsessionid= in URLs (leaks via links and logs).
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${PAWAY_COOKIE_SECURE:false}
