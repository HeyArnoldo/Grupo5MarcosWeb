spring.application.name=Paway
server.port=${PORT:5000}
server.forward-headers-strategy=framework
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

paway.provider.name=${PAWAY_PROVIDER_NAME:Paway Envios S.A.C.}
paway.provider.ruc=${PAWAY_PROVIDER_RUC:20123456789}
paway.provider.address=${PAWAY_PROVIDER_ADDRESS:Av. Los Alamos 123, Lima, Peru}
paway.provider.email=${PAWAY_PROVIDER_EMAIL:atencion@paway.example}
paway.complaints.directory=${PAWAY_COMPLAINTS_DIRECTORY:./data/complaints}
