<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo}+' | TechLab Web'">TechLab Web</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/site.css}">
</head>

<body>
    <header th:fragment="cabecera" class="border-bottom bg-white">
        <nav class="container d-flex flex-wrap align-items-center gap-3 py-3" aria-label="Navegación principal">
            <a class="navbar-brand fw-semibold me-auto" th:href="@{/cursos}" th:text="#{app.nombre}">TechLab Web</a>
            <a class="link-body-emphasis text-decoration-none" th:href="@{/cursos}" th:text="#{nav.cursos}">Cursos</a>
            <a class="link-body-emphasis text-decoration-none" th:href="@{/api/v1/cursos}" th:text="#{nav.api}">API
                JSON</a>
        </nav>
    </header>
    <footer th:fragment="pie" class="border-top bg-white mt-auto">
        <div class="container py-3 small text-body-secondary">
            TechLab Web Marcos de Desarrollo Web 2026
        </div>
    </footer>
</body>

</html>
