<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout:: head(#{curso.lista.titulo})}">
    <meta charset="UTF-8">
    <title>Catálogo de cursos</title>
</head>

<body class="d-flex flex-column min-vh-100">
    <header th:replace="~{fragments/layout:: cabecera}"></header>
    <main class="container py-4">
        <h1 class="display-6 fw-bold" th:text="#{curso.lista.titulo}">Catálogo de cursos</h1>

        <form class="row g-3 align-items-end mb-4" method="get" th:action="@{/cursos}">
            <div class="col-md-8">
                <label class="form-label" for="q" th:text="#{curso.buscar}">Buscar cursos</label>
                <input class="form-control" id="q" name="q" type="search" maxlength="60" th:value="${q}"
                    th:placeholder="#{curso.buscar.placeholder}">
            </div>
            <div class="col-md-4 d-flex gap-2">
                <button class="btn btn-primary" type="submit" th:text="#{accion.buscar}">Buscar</button>
                <a class="btn btn-outline-secondary" th:if="${!#strings.isEmpty(q)}" th:href="@{/cursos}"
                    th:text="#{accion.limpiar}">Limpiar</a>
            </div>
        </form>

        <div class="row g-4" th:unless="${#lists.isEmpty(cursos)}">
            <div class="col-md-6 col-xl-4" th:each="curso: ${cursos}">
                <article class="card course-card h-100 shadow-sm">
                    <div class="card-body d-flex flex-column">
                        <p class="text-body-secondary mb-2">Código <span th:text="${curso.id}">1</span></p>
                        <h2 class="h4 card-title" th:text="${curso.titulo}">Título</h2>
                        <p class="card-text">
                            <span th:text="${curso.horas}">12</span> <span th:text="#{curso.horas}">Horas</span>
                        </p>
                        <a class="btn btn-outline-primary mt-auto align-self-start"
                            th:href="@{/cursos/{id}(id=${curso.id})}" th:text="#{curso.ver}">Ver detalle</a>
                    </div>
                </article>
            </div>
        </div>
    </main>
    <footer th:replace="~{fragments/layout:: pie}"></footer>
</body>

</html>
