<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout:: head(#{curso.detalle.titulo})}">
    <meta charset="UTF-8">
    <title>Detalle del curso</title>
</head>

<body class="d-flex flex-column min-vh-100">
    <header th:replace="~{fragments/layout:: cabecera}"></header>
    <main class="container py-5">
        <section class="mx-auto detail-panel" th:object="${curso}">
            <p class="text-primary fw-semibold" th:text="#{curso.detalle.titulo}">Detalle del curso</p>
            <h1 class="display-6 fw-bold" th:text="*{titulo}">Título</h1>
            <dl class="row mt-4">
                <dt class="col-sm-4">Código</dt>
                <dd class="col-sm-8" th:text="*{id}">1</dd>
                <dt class="col-sm-4" th:text="#{curso.horas}">Horas</dt>
                <dd class="col-sm-8" th:text="*{horas} + ' horas'">16 horas</dd>
            </dl>
            <a class="btn btn-primary mt-3" th:href="@{/cursos}" th:text="#{accion.volver}">Volver al catálogo</a>
        </section>
    </main>
    <footer th:replace="~{fragments/layout:: pie}"></footer>
</body>

</html>
